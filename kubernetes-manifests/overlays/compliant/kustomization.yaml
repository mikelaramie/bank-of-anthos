# Compliant overlay — base workloads + network policies + cursorrules-security.
# Deploy: kubectl apply -k kubernetes-manifests/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
components:
  - ../../components/cursorrules-security
replacements:
  # §1.3 — dedicated ServiceAccount name matches workload name
  - source:
      kind: Deployment
      name: userservice
      fieldPath: metadata.name
    targets:
      - select:
          kind: Deployment
          name: userservice
        fieldPaths:
          - spec.template.spec.serviceAccountName
  - source:
      kind: Deployment
      name: ledgerwriter
      fieldPath: metadata.name
    targets:
      - select:
          kind: Deployment
          name: ledgerwriter
        fieldPaths:
          - spec.template.spec.serviceAccountName
  - source:
      kind: Deployment
      name: frontend
      fieldPath: metadata.name
    targets:
      - select:
          kind: Deployment
          name: frontend
        fieldPaths:
          - spec.template.spec.serviceAccountName
  - source:
      kind: Deployment
      name: balancereader
      fieldPath: metadata.name
    targets:
      - select:
          kind: Deployment
          name: balancereader
        fieldPaths:
          - spec.template.spec.serviceAccountName
  - source:
      kind: Deployment
      name: contacts
      fieldPath: metadata.name
    targets:
      - select:
          kind: Deployment
          name: contacts
        fieldPaths:
          - spec.template.spec.serviceAccountName
  - source:
      kind: Deployment
      name: transactionhistory
      fieldPath: metadata.name
    targets:
      - select:
          kind: Deployment
          name: transactionhistory
        fieldPaths:
          - spec.template.spec.serviceAccountName
  - source:
      kind: Deployment
      name: loadgenerator
      fieldPath: metadata.name
    targets:
      - select:
          kind: Deployment
          name: loadgenerator
        fieldPaths:
          - spec.template.spec.serviceAccountName
  - source:
      kind: StatefulSet
      name: ledger-db
      fieldPath: metadata.name
    targets:
      - select:
          kind: StatefulSet
          name: ledger-db
        fieldPaths:
          - spec.template.spec.serviceAccountName
  - source:
      kind: StatefulSet
      name: accounts-db
      fieldPath: metadata.name
    targets:
      - select:
          kind: StatefulSet
          name: accounts-db
        fieldPaths:
          - spec.template.spec.serviceAccountName
